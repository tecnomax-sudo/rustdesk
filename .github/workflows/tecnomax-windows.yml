# Tecnomax Connect: build do cliente Windows x64 com o rebrand aplicado.
# Baseado no job build-for-windows-flutter do flutter-build.yml do upstream, só a parte x64.
# Servidor e chave vêm das variáveis do repositório (não são segredo: vão dentro do .exe).
# Sem assinatura de código por enquanto: o .exe sai "unsigned".
#
# Só roda por disparo manual (Actions → tecnomax-windows → Run workflow). Cada build leva ~40 min
# por variante; não há mais disparo automático por push.
#
# Variantes (input "variante"):
#   tecnico → TecnomaxConnect-x64.exe, versão completa (conecta e recebe). É o arquivo do botão da
#             página /connect: .../releases/latest/download/TecnomaxConnect-x64.exe
#   suporte → TecnomaxConnectSuporte-x64.exe, "Tecnomax Connect Suporte", só recebe conexões
#             (conn-type=incoming), para o cliente final
#   ambas   → as duas, em paralelo
# Publicar exige a variante técnica no build (tecnico ou ambas): a release vira a "latest" e o link
# do site precisa continuar achando TecnomaxConnect-x64.exe nela.
name: tecnomax-windows

on:
  workflow_dispatch:
    inputs:
      variante:
        description: "Qual programa compilar"
        type: choice
        options: [tecnico, suporte, ambas]
        default: tecnico
      publicar:
        description: "Publicar como release (vira o download do site; exige tecnico ou ambas)"
        type: boolean
        default: false
      msi:
        description: "Gerar também o instalador .msi (vai para a release se publicar)"
        type: boolean
        default: false

# um build novo na mesma branch cancela o que estiver rodando
concurrency:
  group: tecnomax-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Motor do Flutter modificado pela RustDesk. O upstream só publica a tag móvel "main" (asset
  # id 210168939, enviado em 01/12/2024, 63.301.215 bytes). Travado pelo SHA256: se a RustDesk
  # trocar o arquivo, o build FALHA de propósito no passo "Replace engine". Como atualizar o
  # hash: tecnomax/PLANO-ATUALIZACAO.md, seção "Motor do Flutter".
  ENGINE_URL: "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip"
  ENGINE_SHA256: "ec8cabf36ee4ff24c8d98de25b00e70781eb03876265aee84d0fe554a110036e"
  TM_RENDEZVOUS_SERVER: ${{ vars.TM_RENDEZVOUS_SERVER }}
  TM_RS_PUB_KEY: ${{ vars.TM_RS_PUB_KEY }}
  # Nome técnico (sem espaço): vira o nome do executável, da pasta de instalação e do serviço.
  # É o mesmo nas duas variantes (ver tecnomax/rebrand.py, TM_SO_RECEBER).
  TM_APP_ID: TecnomaxConnect
  # "1" tira do pacote o modo privacidade por janela injetada (ver tecnomax/rebrand.py).
  # Liga/desliga pela variável do repositório, sem mexer no código.
  TM_SEM_MODO_PRIVACIDADE: ${{ vars.TM_SEM_MODO_PRIVACIDADE }}

jobs:
  # Jobs que chamam workflow reutilizável não aceitam timeout-minutes (limite do GitHub).
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # DLL do modo privacidade: só compila quando ela vai entrar no pacote.
  build-topmost:
    if: ${{ vars.TM_SEM_MODO_PRIVACIDADE != '1' }}
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    needs: [generate-bridge, build-topmost]
    # build-topmost pulado (modo privacidade fora) não pode pular este job em cascata
    if: >-
      ${{ !cancelled()
          && needs.generate-bridge.result == 'success'
          && (needs.build-topmost.result == 'success' || needs.build-topmost.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variante: ${{ fromJSON(inputs.variante == 'ambas' && '["tecnico","suporte"]' || format('["{0}"]', inputs.variante)) }}
    env:
      TM_SO_RECEBER: ${{ matrix.variante == 'suporte' && '1' || '' }}
      # Nome dos arquivos entregues (o nome técnico do exe instalado não muda)
      TM_ARQ: ${{ matrix.variante == 'suporte' && 'TecnomaxConnectSuporte' || 'TecnomaxConnect' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rebrand Tecnomax
        shell: bash
        run: |
          test -n "$TM_RENDEZVOUS_SERVER" && test -n "$TM_RS_PUB_KEY"
          python3 tecnomax/rebrand.py

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri $env:ENGINE_URL -OutFile windows-x64-release.zip
          $hash = (Get-FileHash windows-x64-release.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:ENGINE_SHA256) {
            Write-Error "Motor do Flutter mudou no upstream: SHA256 $hash, esperado $env:ENGINE_SHA256. Ver tecnomax/PLANO-ATUALIZACAO.md (Motor do Flutter)."
            exit 1
          }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      # Cache por variante: o conn-type muda o hbb_common e recompila quase tudo
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: tecnomax-windows-2022-${{ matrix.variante }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # O executável sai do Flutter como rustdesk.exe. O código do RustDesk supõe que ele tem o
          # nome do app (instalação, taskkill, serviço portátil), e o próprio upstream renomeia a
          # cópia antes de empacotar clientes personalizados. Com o nome certo, o portátil também
          # extrai em %LOCALAPPDATA%\tecnomaxconnect, separado do RustDesk oficial.
          mv ./rustdesk/rustdesk.exe "./rustdesk/$($env:TM_APP_ID).exe"

      - name: Download RustDeskTempTopMostWindow artifacts
        if: ${{ env.TM_SEM_MODO_PRIVACIDADE != '1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Upload pasta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connect-pasta-${{ matrix.variante }}
          path: rustdesk

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${TM_APP_ID}.exe"
          popd
          mkdir -p ./saida
          mv ./target/release/rustdesk-portable-packer.exe "./saida/${TM_ARQ}-${GITHUB_SHA::7}-x64.exe"
          # Mesmo programa em .zip (pasta pronta, sem autoextração): alternativa para quando o
          # antivírus implica com o .exe que se descompacta sozinho.
          mv ./rustdesk "./${TM_APP_ID}"
          7z a -tzip "./saida/${TM_ARQ}-${GITHUB_SHA::7}-x64.zip" "./${TM_APP_ID}" > /dev/null
          mv "./${TM_APP_ID}" ./rustdesk
          sha256sum ./saida/*

      - name: Upload exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connect-exe-${{ matrix.variante }}
          path: saida
          if-no-files-found: error

      # Instalador .msi (input "msi"). Mesmo projeto WiX do upstream (res/msi), com nome técnico,
      # fabricante e links da Tecnomax; na variante Suporte o MSI leva CC_CONNECTION_TYPE=incoming.
      # O UpgradeCode sai do nome técnico, igual nas duas variantes: um MSI atualiza o outro.
      # Pedido no disparo, uma falha aqui derruba o build (e a release não sai pela metade).
      - name: Add MSBuild to PATH
        if: ${{ inputs.msi }}
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        if: ${{ inputs.msi }}
        shell: bash
        run: |
          set -e
          CONN=""
          if [ "$TM_SO_RECEBER" = "1" ]; then CONN="--conn-type incoming"; fi
          pushd ./res/msi
          python preprocess.py -d ../../rustdesk --app-name "$TM_APP_ID" -m "Tecnomax" $CONN \
            --custom-arp '{"Contact": {"msi": "ARPCONTACT", "v": "https://www.tecnomax.tech/suporte"}, "HelpLink": {"msi": "ARPHELPLINK", "v": "https://www.tecnomax.tech/suporte"}, "ReadMe": {"msi": "ARPREADME", "v": "https://www.tecnomax.tech/connect"}}'
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 -p:TargetVersion=Windows10
          MSI=$(ls ./Package/bin/*/Release/en-us/Package.msi | head -n1)
          popd
          mkdir -p ./saida-msi
          mv "./res/msi/${MSI#./}" "./saida-msi/${TM_ARQ}-x64.msi"
          sha256sum ./saida-msi/*

      - name: Upload msi
        if: ${{ inputs.msi }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connect-msi-${{ matrix.variante }}
          path: saida-msi
          if-no-files-found: error

  # Release pública: o site aponta para .../releases/latest/download/TecnomaxConnect-x64.exe,
  # então os nomes dos arquivos são fixos. Só com "publicar" e com a variante técnica no build.
  release:
    needs: [build-windows]
    if: >-
      ${{ !cancelled() && needs.build-windows.result == 'success'
          && inputs.publicar && inputs.variante != 'suporte' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: connect-exe-*
          path: saida
          merge-multiple: true
      - if: ${{ inputs.msi }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: connect-msi-*
          path: saida
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd saida
          CURTO=${GITHUB_SHA::7}
          # TecnomaxConnect-<sha>-x64.exe → TecnomaxConnect-x64.exe (idem Suporte e .zip)
          for f in *-"${CURTO}"-x64.*; do mv "$f" "${f/-${CURTO}/}"; done
          # A release vira a "latest": sem a versão completa, o botão do site quebraria
          test -f TecnomaxConnect-x64.exe
          for f in *-x64.exe *-x64.zip *-x64.msi; do
            if [ -f "$f" ]; then sha256sum "$f" > "$f.sha256"; fi
          done
          DATA=$(date -u +%Y.%m.%d)
          TAG="connect-v${DATA}-${CURTO}"
          {
            echo "Tecnomax Connect para Windows (x64), versão ${DATA}."
            echo
            echo "- Servidor: ${TM_RENDEZVOUS_SERVER}"
            echo "- TecnomaxConnect-x64.exe: versão completa (técnico: conecta e recebe)."
            if [ -f TecnomaxConnectSuporte-x64.exe ]; then
              echo "- TecnomaxConnectSuporte-x64.exe: \"Tecnomax Connect Suporte\", só recebe conexões (cliente final)."
            fi
            echo "- .zip: mesmo programa, sem autoextração. .msi (quando houver): instalação silenciosa por GPO/RMM."
            echo "- Executáveis sem assinatura de código: o Windows avisa \"editor desconhecido\" ao abrir."
            echo
            echo "SHA256:"
            echo '```'
            cat ./*.sha256
            echo '```'
            echo
            echo "Baseado no RustDesk (AGPL-3.0). Código-fonte desta versão:"
            echo "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
            echo "e do servidor: https://github.com/tecnomax-sudo/rustdesk-server/tree/tecnomax"
          } > notas.md
          gh release create "$TAG" ./*-x64.* \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tecnomax Connect ${DATA}" --notes-file notas.md --latest
