# Tecnomax Connect: build do cliente Windows x64 com o rebrand aplicado.
# Baseado no job build-for-windows-flutter do flutter-build.yml do upstream, só a parte x64.
# Servidor e chave vêm das variáveis do repositório (não são segredo: vão dentro do .exe).
# Sem assinatura de código por enquanto: o .exe sai "unsigned".
name: tecnomax-windows

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar como release (vira o download do site)"
        type: boolean
        default: false
  push:
    branches: [tecnomax]
    paths: ["tecnomax/rebrand.py", "tecnomax/marca/**", ".github/workflows/tecnomax-windows.yml"]

# um build novo na mesma branch cancela o que estiver rodando
concurrency:
  group: tecnomax-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  TM_RENDEZVOUS_SERVER: ${{ vars.TM_RENDEZVOUS_SERVER }}
  TM_RS_PUB_KEY: ${{ vars.TM_RS_PUB_KEY }}
  # Nome técnico (sem espaço): vira o nome do executável, da pasta de instalação e do serviço.
  TM_APP_ID: TecnomaxConnect
  # "1" tira do pacote o modo privacidade por janela injetada (ver tecnomax/rebrand.py).
  # Liga/desliga pela variável do repositório, sem mexer no código.
  TM_SEM_MODO_PRIVACIDADE: ${{ vars.TM_SEM_MODO_PRIVACIDADE }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    needs: [generate-bridge, build-topmost]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Rebrand Tecnomax
        shell: bash
        run: |
          test -n "$TM_RENDEZVOUS_SERVER" && test -n "$TM_RS_PUB_KEY"
          python3 tecnomax/rebrand.py

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: tecnomax-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # O executável sai do Flutter como rustdesk.exe. O código do RustDesk supõe que ele tem o
          # nome do app (instalação, taskkill, serviço portátil), e o próprio upstream renomeia a
          # cópia antes de empacotar clientes personalizados. Com o nome certo, o portátil também
          # extrai em %LOCALAPPDATA%\tecnomaxconnect, separado do RustDesk oficial.
          mv ./rustdesk/rustdesk.exe "./rustdesk/$($env:TM_APP_ID).exe"

      - name: Download RustDeskTempTopMostWindow artifacts
        if: ${{ env.TM_SEM_MODO_PRIVACIDADE != '1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Upload pasta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tecnomax-connect-windows-x64-pasta
          path: rustdesk

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${TM_APP_ID}.exe"
          popd
          mkdir -p ./saida
          mv ./target/release/rustdesk-portable-packer.exe "./saida/TecnomaxConnect-${GITHUB_SHA::7}-x64.exe"
          # Mesmo programa em .zip (pasta pronta, sem autoextração): alternativa para quando o
          # antivírus implica com o .exe que se descompacta sozinho.
          mv ./rustdesk "./${TM_APP_ID}"
          7z a -tzip "./saida/TecnomaxConnect-${GITHUB_SHA::7}-x64.zip" "./${TM_APP_ID}" > /dev/null
          mv "./${TM_APP_ID}" ./rustdesk
          sha256sum ./saida/*

      - name: Upload exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tecnomax-connect-windows-x64
          path: saida
          if-no-files-found: error

      # Experimental: instalador .msi (formato que os antivírus tratam melhor que autoextraível).
      # Sai só como artefato do build, não vai para a release, e uma falha aqui não derruba o build.
      - name: Add MSBuild to PATH
        continue-on-error: true
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi (experimental)
        continue-on-error: true
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name "$env:TM_APP_ID" -m "Tecnomax"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mkdir ./saida-msi
          mv $msi.FullName "./saida-msi/TecnomaxConnect-x64.msi"

      - name: Upload msi (experimental)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tecnomax-connect-windows-x64-msi-experimental
          path: saida-msi
          if-no-files-found: warn

  # Release pública: o site aponta para .../releases/latest/download/TecnomaxConnect-x64.exe,
  # então o nome do arquivo é fixo. Só roda no disparo manual com "publicar".
  release:
    needs: [build-windows]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tecnomax-connect-windows-x64
          path: saida
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd saida
          mv TecnomaxConnect-*-x64.exe TecnomaxConnect-x64.exe
          mv TecnomaxConnect-*-x64.zip TecnomaxConnect-x64.zip
          sha256sum TecnomaxConnect-x64.exe > TecnomaxConnect-x64.exe.sha256
          sha256sum TecnomaxConnect-x64.zip > TecnomaxConnect-x64.zip.sha256
          DATA=$(date -u +%Y.%m.%d)
          CURTO=${GITHUB_SHA::7}
          TAG="connect-v${DATA}-${CURTO}"
          cat > notas.md <<EOF
          Tecnomax Connect para Windows (x64), versão ${DATA}.

          - Servidor: ${TM_RENDEZVOUS_SERVER}
          - SHA256 do .exe: $(cut -d' ' -f1 TecnomaxConnect-x64.exe.sha256)
          - SHA256 do .zip (mesmo programa, sem autoextração): $(cut -d' ' -f1 TecnomaxConnect-x64.zip.sha256)
          - Executável sem assinatura de código: o Windows avisa "editor desconhecido" ao abrir.

          Baseado no RustDesk (AGPL-3.0). Código-fonte desta versão:
          https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}
          e do servidor: https://github.com/tecnomax-sudo/rustdesk-server/tree/tecnomax
          EOF
          gh release create "$TAG" TecnomaxConnect-x64.exe TecnomaxConnect-x64.exe.sha256 \
            TecnomaxConnect-x64.zip TecnomaxConnect-x64.zip.sha256 \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tecnomax Connect ${DATA}" --notes-file notas.md --latest
